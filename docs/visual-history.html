<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glimpse · 历史版本视觉对照</title><style>body{font-family:system-ui;background:#fcf4e3;color:#161815;max-width:950px;margin:30px auto;padding:16px}select{padding:8px;font:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:20px 0}img{width:100%;max-width:390px;border:1px solid #b8b6a8;border-radius:10px}p{line-height:1.7}</style><h1>Glimpse · 历史版本视觉对照</h1><p>使用 GitHub 原始版本图片对照，不会修改本机照片或评分。需要联网；只有发布分支完成上传后，历史图片才可访问。截图为演示／隔离记录。</p><label>对照页面 <select id="page"><option value="home">首页</option><option value="selection">选区笔迹</option><option value="describe">描述</option><option value="reveal">显影</option><option value="timeline">时间轴</option><option value="calendar">月历</option></select></label><div class="pair"><figure><label>版本 <select id="before"><option>0.4.0</option><option selected>0.5.0</option><option>0.5.1</option></select></label><p id="a-label"></p><img id="a" alt="对照前版本界面"></figure><figure><label>版本 <select id="after"><option>0.4.0</option><option>0.5.0</option><option selected>0.5.1</option></select></label><p id="b-label"></p><img id="b" alt="对照后版本界面"></figure></div><script>function draw(){for(const [image,select]of [['a','before'],['b','after']]){const version=document.getElementById(select).value,page=document.getElementById('page').value;document.getElementById(image).src='https://raw.githubusercontent.com/Jessica-yaoyao/Glimpse/refs/heads/release/'+version+'/docs/images/'+page+'.png';document.getElementById(image+'-label').textContent='v'+version}}for(const el of document.querySelectorAll('select'))el.onchange=draw;draw()</script></html>
